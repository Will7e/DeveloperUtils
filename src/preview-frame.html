      '</div>' +
      '<div class="activity-bar-bottom"><div class="activity-bar-divider"></div>' +
        '<a class="nav-item"><span class="nav-item-icon"><span style="display:block;width:16px;height:16px;border-radius:3px;background:currentColor;opacity:.75"></span></span><span class="nav-item-label">Settings</span></a>' +

      '</div>' +
    '</nav>' +
    '<main class="main-content">' +
      '<div class="compiler-view">' +

        '<div class="flex-1 flex flex-col min-w-0 overflow-hidden">' +
          '<div class="app-main mobile-pane-editor">' +
            '<div class="app-editor-section"><div class="tabs-bar"><div class="tabs-list"><div class="tab tab-active">main.js</div></div></div><div class="app-editor-content"><div class="editor-full" style="background:var(--bg-1);padding:12px;font-family:monospace;color:var(--text-2);font-size:12px">const fib = (n) =&gt;<br>&nbsp;&nbsp;n &lt;= 1 ? n : fib(n-1) + fib(n-2);</div></div></div>' +
            '<div class="compiler-mobile-toggle-bar"><div class="compiler-mobile-toggle" role="tablist"><button class="active" onclick="window.__pane(\'editor\')">Editor</button><button onclick="window.__pane(\'output\')">Output</button></div></div>' +

          '<div class="status-bar"><div class="status-left"><span class="status-item status-brand">InTab</span><span class="status-dot">·</span><span class="status-item">JAVASCRIPT</span><span class="status-dot">·</span><span class="status-item">Ln 42</span></div><div class="status-right"><span class="status-item status-shortcut">⌘↵ Run</span><span class="status-dot">·</span><span class="status-item status-shortcut">⌘K Commands</span></div></div>' +
        '</div>' +
      '</div>' +
    '</main>';

  window.__pane = function(p){
    var m = document.querySelector('.app-main');

    document.querySelectorAll('.compiler-mobile-toggle button').forEach(function(b, i){
      b.classList.toggle('active', (i === 0) === (p === 'editor'));
    });
  };

  // Expose drawer/toggle actions for the harness via postMessage
  window.addEventListener('message', function(e){
    var cmd = e.data || {};
    if (cmd.action === 'library') {
      frame.innerHTML =

          '<button class="lib-scrim" onclick="this.closest(\'.lib-layout\').classList.remove(\'lib-sidebar-open\')"></button>' +

      var el = document.documentElement;
      el.classList.toggle('dark', cmd.theme === 'dark');
      el.classList.toggle('light', cmd.theme === 'light');
      el.style.colorScheme = cmd.theme;
    }
  });
})();
</script>
</body>
</html>
