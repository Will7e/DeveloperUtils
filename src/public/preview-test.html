<!doctype html>
<!-- Temporary preview-verification page (uncommitted): a same-origin target
     the docked preview's browser chrome can be exercised against in dev. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview verification</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; background: #fafaf7; color: #222; }
      h1 { font-size: 28px; } .ok { color: #0a7d33; font-weight: 700; }
      #w { margin-top: 12px; font-family: monospace; }
      @media (max-width: 500px) { body { background: #e8f0ff; } h1::after { content: " (mobile layout)"; } }
    </style>
  </head>
  <body>
    <h1>PREVIEW <span class="ok">WORKS</span></h1>
    <p id="w"></p>
    <script>
      document.getElementById("w").textContent =
        "viewport width: " + window.innerWidth + "px — innerWidth decides the media query";
    </script>
  </body>
</html>
