<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting…</title>
    <style>
      body {
        font-family: "Geist", system-ui, -apple-system, sans-serif;
        background: #0a0a0a;
        color: #ededed;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .box { text-align: center; max-width: 420px; padding: 32px; }
      .spinner {
        width: 28px; height: 28px; margin: 0 auto 16px;
        border: 3px solid #333; border-top-color: #0070f3;
        border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .err { color: #ff6369; font-size: 14px; white-space: pre-wrap; }
      .hint { color: #888; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner" id="spinner"></div>
      <div id="message">Completing sign-in…</div>
      <div class="err" id="error"></div>
      <div class="hint" id="hint" style="display:none">You can close this window and try again.</div>
    </div>

    <!-- External module: the site's Content-Security-Policy ships without
         'unsafe-inline', so an inline script would be silently blocked in
         production and sign-in would die on this page for every provider. -->
    <script type="module" src="./callback.js"></script>
  </body>
</html>
