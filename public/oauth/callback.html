<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting…</title>
  <style>
    body {
      font-family: "Geist", system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #ededed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .box { text-align: center; max-width: 420px; padding: 32px; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 16px;
      border: 3px solid #333; border-top-color: #0070f3;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #ff6369; font-size: 14px; white-space: pre-wrap; }
    .hint { color: #888; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div id="message">Completing sign-in…</div>
    <div class="err" id="error"></div>
    <div class="hint" id="hint" style="display:none">You can close this window and try again.</div>
  </div>

  <script type="module">
    // ── Standalone OAuth callback (no app modules — must load without the SPA) ──
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = window.sessionStorage.getItem("intab_oauth_state_url") ||
      new URL(params.get("state") ? "http://x/?state=" + encodeURIComponent(params.get("state")) : "http://x/").searchParams.get("state");

    // state travels in the query; sessionStorage relay keys are derived from it
    const stateKey = params.get("state");

    function fail(message) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("message").textContent = "Sign-in failed";
      document.getElementById("error").textContent = message;
      document.getElementById("hint").style.display = "block";
    }

    function succeed(result) {
      try {
        // Relay via localStorage (shared across same-origin windows)
        localStorage.setItem("intab_oauth_result_" + stateKey, JSON.stringify({ ok: true, tokens: result }));
        window.opener?.postMessage({ type: "intab-oauth-complete", state: stateKey }, window.location.origin);
      } catch (e) {
        // Storage unavailable — postMessage fallback only
        try {
          window.opener?.postMessage({ type: "intab-oauth-complete", state: stateKey, tokens: result }, window.location.origin);
        } catch { /* give up */ }
      }
      setTimeout(() => window.close(), 400);
    }

    if (params.get("error")) {
      fail(params.get("error_description") || params.get("error"));
    } else if (!code || !stateKey) {
      fail("Missing authorization code or state.");
    } else {
      // Flow context was handed off via localStorage by the opener window
      let flow = null;
      try {
        flow = JSON.parse(localStorage.getItem("intab_oauth_handoff_" + stateKey) || "null");
      } catch { /* noop */ }

      if (!flow || !flow.verifier || !flow.clientId) {
        fail("Sign-in session expired. Please try again.");
      } else {
        exchange(flow, code).then(succeed).catch((e) => fail(e?.message || "Token exchange failed"));
      }
    }

    async function exchange(flow, code) {
      const tokenUrl = flow.provider === "googledrive"
        ? "https://oauth2.googleapis.com/token"
        : "https://login.microsoftonline.com/common/oauth2/v2.0/token";

      const body = new URLSearchParams({
        client_id: flow.clientId,
        code,
        code_verifier: flow.verifier,
        redirect_uri: window.location.origin + "/oauth/callback.html",
        grant_type: "authorization_code",
      });

      const res = await fetch(tokenUrl, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error("Token exchange failed (" + res.status + ")");
      }

      const json = await res.json();
      return {
        accessToken: json.access_token,
        refreshToken: json.refresh_token ?? null,
        expiresIn: json.expires_in ?? 3600,
        scope: json.scope ?? "",
      };
    }
  </script>
</body>
</html>
