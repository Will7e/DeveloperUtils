<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
    Content Security Policy — trusted developer runtime CDNs only.

    This meta tag is the DEV / non-Vercel policy, so it keeps script-src
    'unsafe-inline' for Vite's injected HMR preamble. The authoritative
    production policy is the Content-Security-Policy header in vercel.json,
    which is stricter: it drops 'unsafe-inline' from script-src. Both policies
    apply in production and browsers enforce their intersection, which is why
    index.html contains no inline <script> — everything lives in
    /theme-init.js and /boot.js. Keep the two definitions in sync.

    'unsafe-eval' is required by the code runner and the preview bundler
    (new Function / wasm runtimes); connect-src is intentionally open because
    the API tester and previewed apps must reach arbitrary hosts.

    https://esm.sh is in script-src because the live preview's React shim is
    an import map pointing there (see preview-runtime.ts). The preview frame is
    a srcdoc document, so it INHERITS this policy — leaving esm.sh out of
    script-src silently blocked the preview bundle's first `import "react"`,
    and the pane rendered nothing at all with no error to show for it.

    https://stackblitz.com is in frame-src/child-src for the same class of
    reason, and this is the copy that was left behind when the browser workspace
    was added: the runtime arrives in a hidden cross-origin iframe, and the meta
    policy (which applies in production too, intersected with the header) forbade
    it. The console said "Refused to frame 'https://stackblitz.com/'" and the
    boot never resolved — a hang with no error, because a blocked iframe does not
    reject the promise waiting on it. deployment-headers.test.ts now fails if this
    policy stops covering the deployment's, so the four copies cannot drift again.
  -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; object-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://esm.sh blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://esm.sh; connect-src *; img-src 'self' data: blob: https:; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob: https://cdn.jsdelivr.net https://stackblitz.com; frame-src 'self' blob: https://cdn.jsdelivr.net https://stackblitz.com; base-uri 'self'; form-action 'self';" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Viewport & Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b10" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- SEO -->
  <title>InTab — Developer Tools in Your Browser</title>
  <link rel="canonical" href="https://in-tab.se/" />
  <meta name="description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />
  <meta name="keywords" content="InTab, developer tools, code editor, compiler, API tester, diff checker, formatters, client-side, privacy, offline" />
  <meta name="author" content="InTab" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="InTab — Developer Tools in Your Browser" />
  <meta property="og:url" content="https://in-tab.se/" />
  <meta property="og:description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />
  <meta property="og:site_name" content="InTab" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="InTab — Developer Tools in Your Browser" />
  <meta name="twitter:url" content="https://in-tab.se/" />
  <meta name="twitter:description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />

  <!-- Preconnect & Preload Fonts + Monaco CDN (editor runtime boots from jsdelivr) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    as="style" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <!-- Critical inline styles for instant loading screen -->
  <style>
    body {
      margin: 0;
      background: #0a0b10;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0b10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .loader-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      animation: loader-pulse 2s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loader-bar-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #64748b, #cbd5e1, #ffffff);
      border-radius: 2px;
      animation: loader-slide 1.2s ease-in-out infinite;
    }

    @keyframes loader-pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 0 transparent);
        opacity: 0.7;
      }

      50% {
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
        opacity: 1;
      }
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    /* Light Theme Overrides for Loading Screen */
    html.light body {
      background: #f8fafc;
    }

    html.light #loading-screen {
      background: #f8fafc;
    }

    html.light .loader-text {
      background: linear-gradient(135deg, #0f172a 0%, #334155 50%, #64748b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    html.light .loader-icon {
      filter: drop-shadow(0 2px 6px rgba(2, 132, 199, 0.2));
    }

    html.light .loader-bar-track {
      background: rgba(0, 0, 0, 0.08);
    }

    html.light .loader-bar-fill {
      background: linear-gradient(90deg, #94a3b8, #475569, #0f172a);
    }
  </style>

  <!-- Prevent theme flashing on load (external: production CSP forbids inline script) -->
  <script src="/theme-init.js"></script>
</head>

<body>
  <!-- Loading screen — visible until React mounts -->
  <div id="loading-screen">
    <div class="loader-brand">
      <img class="loader-icon" src="/favicon.svg" alt="InTab" width="32" height="32" />
      <span class="loader-text">InTab</span>
    </div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Excalidraw asset path, loader dismissal and its stall fallback -->
  <script src="/boot.js"></script>
</body>

</html>
