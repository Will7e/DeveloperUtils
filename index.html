<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Viewport & Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b10" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- SEO -->
  <title>DevUtils | Code Editor & Compiler</title>
  <meta name="description"
    content="The elite browser-based IDE for developers who value their sanity. Write, compile, and debug code while pretending you know exactly what you're doing." />
  <meta name="keywords" content="code editor, compiler, IDE, JavaScript, TypeScript, Python, HTML, browser, online" />
  <meta name="author" content="DevUtils" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DevUtils — Code Compiler & Editor" />
  <meta property="og:description"
    content="The premium workspace where bugs go to die and features come to life. No setup, no drama, just pure code execution." />
  <meta property="og:site_name" content="DevUtils" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="DevUtils — Code Compiler & Editor" />
  <meta name="twitter:description"
    content="The elite workspace where your code runs fast, your bugs hide in fear, and 'it works on my machine' becomes a universal truth." />

  <!-- Preconnect & Preload Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    as="style" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <!-- Critical inline styles for instant loading screen -->
  <style>
    body {
      margin: 0;
      background: #0a0b10;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0b10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .loader-icon {
      width: 20px;
      height: 20px;
      color: #818cf8;
      fill: rgba(129, 140, 248, 0.15);
      animation: loader-pulse 2s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #818cf8, #a78bfa, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loader-bar-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8, #a78bfa);
      border-radius: 2px;
      animation: loader-slide 1.2s ease-in-out infinite;
    }

    @keyframes loader-pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 0 transparent);
        opacity: 0.7;
      }

      50% {
        filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.5));
        opacity: 1;
      }
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    /* Light Theme Overrides for Loading Screen */
    html.light body {
      background: #f8fafc;
    }

    html.light #loading-screen {
      background: #f8fafc;
    }

    html.light .loader-text {
      background: linear-gradient(135deg, #0284c7, #0369a1, #075985);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    html.light .loader-icon {
      color: #0284c7;
      fill: rgba(2, 132, 199, 0.12);
    }

    html.light .loader-bar-track {
      background: rgba(0, 0, 0, 0.08);
    }

    html.light .loader-bar-fill {
      background: linear-gradient(90deg, #0ea5e9, #0284c7, #0369a1);
    }
  </style>

  <!-- Prevent theme flashing on load -->
  <script>
    try {
      const stateStr = localStorage.getItem('devutils-app-state');
      if (stateStr) {
        const state = JSON.parse(stateStr);
        if (state && state.state && state.state.editorSettings && state.state.editorSettings.theme === 'light') {
          document.documentElement.classList.add('light');
        }
      }
    } catch (e) {
      console.error('Failed to parse theme from local storage', e);
    }
  </script>
</head>

<body>
  <!-- Loading screen — visible until React mounts -->
  <div id="loading-screen">
    <div class="loader-brand">
      <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="rgba(129,140,248,0.15)" />
      </svg>
      <span class="loader-text">DevUtils</span>
    </div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Hide loading screen once app mounts -->
  <script>
    const observer = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 500);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.getElementById('root'), { childList: true });
  </script>
</body>

</html>
