<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Content Security Policy — Secured while allowing trusted developer runtime CDNs -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; object-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src *; img-src 'self' data: blob: https:; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'self' blob: https://cdn.jsdelivr.net; base-uri 'self'; form-action 'self';" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Viewport & Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b10" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- SEO -->
  <title>InTab — Developer Tools in Your Browser</title>
  <link rel="canonical" href="https://in-tab.se/" />
  <meta name="description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />
  <meta name="keywords" content="InTab, developer tools, code editor, compiler, API tester, diff checker, formatters, client-side, privacy, offline" />
  <meta name="author" content="InTab" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="InTab — Developer Tools in Your Browser" />
  <meta property="og:url" content="https://in-tab.se/" />
  <meta property="og:description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />
  <meta property="og:site_name" content="InTab" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="InTab — Developer Tools in Your Browser" />
  <meta name="twitter:url" content="https://in-tab.se/" />
  <meta name="twitter:description"
    content="Everyday developer tools that run right in your browser tab. Code runner, API tester, diff checker, formatters, and whiteboard diagrams—fast, private, and offline." />

  <!-- Preconnect & Preload Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    as="style" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

  <!-- Critical inline styles for instant loading screen -->
  <style>
    body {
      margin: 0;
      background: #0a0b10;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0b10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .loader-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      animation: loader-pulse 2s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loader-bar-track {
      width: 180px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }

    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #64748b, #cbd5e1, #ffffff);
      border-radius: 2px;
      animation: loader-slide 1.2s ease-in-out infinite;
    }

    @keyframes loader-pulse {

      0%,
      100% {
        filter: drop-shadow(0 0 0 transparent);
        opacity: 0.7;
      }

      50% {
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
        opacity: 1;
      }
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(350%);
      }
    }

    /* Light Theme Overrides for Loading Screen */
    html.light body {
      background: #f8fafc;
    }

    html.light #loading-screen {
      background: #f8fafc;
    }

    html.light .loader-text {
      background: linear-gradient(135deg, #0f172a 0%, #334155 50%, #64748b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    html.light .loader-icon {
      filter: drop-shadow(0 2px 6px rgba(2, 132, 199, 0.2));
    }

    html.light .loader-bar-track {
      background: rgba(0, 0, 0, 0.08);
    }

    html.light .loader-bar-fill {
      background: linear-gradient(90deg, #94a3b8, #475569, #0f172a);
    }
  </style>

  <!-- Prevent theme flashing on load -->
  <script>
    try {
      const theme = localStorage.getItem('intab_theme') || localStorage.getItem('devutils_theme');
      if (theme === 'light') {
        document.documentElement.classList.add('light');
      } else if (!theme) {
        const stateStr = localStorage.getItem('intab-app-state') || localStorage.getItem('devutils-app-state');
        if (stateStr) {
          const state = JSON.parse(stateStr);
          if (state && state.state && state.state.editorSettings && state.state.editorSettings.theme === 'light') {
            document.documentElement.classList.add('light');
          }
        }
      }
    } catch (e) {}
  </script>

  <!-- DrawFlow / Excalidraw engine assets path -->
  <script>
    window.EXCALIDRAW_ASSET_PATH = "/";
  </script>
</head>

<body>
  <!-- Loading screen — visible until React mounts -->
  <div id="loading-screen">
    <div class="loader-brand">
      <img class="loader-icon" src="/favicon.svg" alt="InTab" width="32" height="32" />
      <span class="loader-text">InTab</span>
    </div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Controlled dismiss of loading screen -->
  <script>
    window.__INTAB_DISMISS_LOADER__ = function() {
      if (window.__INTAB_LOADER_DISMISSED__) return;
      window.__INTAB_LOADER_DISMISSED__ = true;
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => {
          try { loader.remove(); } catch (e) {}
        }, 500);
      }
    };
    window.__DEVUTILS_DISMISS_LOADER__ = window.__INTAB_DISMISS_LOADER__;

    // Safety fallback: guarantee loading screen is dismissed even if network stalls
    setTimeout(() => {
      window.__INTAB_DISMISS_LOADER__();
    }, 3500);
  </script>
</body>

</html>
